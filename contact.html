<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <style>
        body { font-family: Arial, sans-serif; }
        form { margin: 20px; }
        label { display: block; margin-bottom: 8px; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; }
        button { background-color: #28a745; color: white; padding: 10px 15px; border: none; cursor: pointer; }
        .whatsapp-button { background-color: #25D366; color: white; padding: 10px 15px; display: inline-block; margin-top: 10px; text-decoration: none; }
    </style>
</head>
<body>
    <h1>Contact Us</h1>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button type="submit">Submit</button>
    </form>
    <a href="https://wa.me/201031732444" class="whatsapp-button">Contact us on WhatsApp</a>
    
    <script>
        // Language support for Arabic and English
        const lang = navigator.language || navigator.userLanguage;
        if (lang.startsWith('ar')) {
            document.body.innerHTML = document.body.innerHTML
            .replace('Contact Us', 'اتصل بنا')
            .replace('Name:', 'الاسم:')
            .replace('Email:', 'البريد الإلكتروني:')
            .replace('Message:', 'الرسالة:')
            .replace('Submit', 'إرسال');
        }
    </script>
</body>
</html>
